name: Impact snapshot

on:
  schedule:
    # 03:00 UTC on the 1st of every month
    - cron: '0 3 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install boast
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/mbhall88/boast/releases/latest/download/boast-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run boast for Mashtree
        id: mashtree
        run: |
          set -euo pipefail
          mkdir -p snapshots
          boast about --repo lskatz/mashtree --snapshot-dir snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run boast for Fasten
        id: fasten
        run: |
          set -euo pipefail
          boast about --repo lskatz/fasten --snapshot-dir snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Markdown reports
        if: always()
        run: |
          set -euo pipefail
          snapshots_found=$(find snapshots -maxdepth 1 -name '*.json' | sort)
          {
            echo "# Software Impact Boasts"
            echo ""
            echo "Generated by [boast](https://github.com/mbhall88/boast)."
            echo ""
          } > BOASTS.md

          if [ -z "$snapshots_found" ]; then
            echo "_No snapshots were found in this run._" >> BOASTS.md
            exit 0
          fi

          while IFS= read -r snapshot; do
            [ -z "$snapshot" ] && continue
            echo "## $(basename "$snapshot")" >> BOASTS.md
            if ! boast render "$snapshot" --format markdown >> BOASTS.md; then
              echo "" >> BOASTS.md
              echo "> ⚠️ `boast render` exited non-zero for $(basename "$snapshot")." >> BOASTS.md
            fi
            echo "" >> BOASTS.md
          done <<< "$snapshots_found"

      - name: Generate profile summary
        run: |
          set -euo pipefail
          python scripts/generate_profile_summary.py

      - name: Upload snapshots as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: impact-snapshots
          path: |
            snapshots/
            BOASTS.md

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automated/impact-snapshot
          delete-branch: true
          commit-message: Update impact snapshot
          title: Update impact snapshot reports
          body: |
            ## Summary
            - update `BOASTS.md` from the latest boast snapshots
            - refresh the profile README impact summary with a link back to `BOASTS.md`
          add-paths: |
            BOASTS.md
            README.md
