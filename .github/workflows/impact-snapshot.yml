name: Impact snapshot

on:
  schedule:
    # 03:00 UTC on the 1st of every month
    - cron: '0 3 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install boast
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/mbhall88/boast/releases/latest/download/boast-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run boast for Mashtree
        id: mashtree
        run: |
          set -euo pipefail
          mkdir -p snapshots
          boast about --repo lskatz/mashtree --snapshot-dir snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run boast for Fasten
        id: fasten
        run: |
          set -euo pipefail
          boast about --repo lskatz/fasten --snapshot-dir snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Markdown reports
        if: always()
        run: |
          set -euo pipefail
          {
            echo "# Software Impact Boasts"
            echo ""
            echo "Generated by [boast](https://github.com/mbhall88/boast)."
            echo ""
            for snapshot in $(find snapshots -maxdepth 1 -name '*.json' | sort); do
              boast render "$snapshot" --format markdown
              echo ""
            done
          } > BOASTS.md

      - name: Upload snapshots as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-snapshots
          path: snapshots/

      - name: Create branch and pull request
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="boast/update-$(date +%Y%m%d)"
          git checkout -b "$branch"
          git add snapshots BOASTS.md
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "chore: update impact boasts"
          git push origin "$branch"
          gh pr create \
            --title "chore: update impact boasts" \
            --body "Automated update of software impact metrics via [boast](https://github.com/mbhall88/boast)." \
            --base main \
            --head "$branch" || echo "PR already exists"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
